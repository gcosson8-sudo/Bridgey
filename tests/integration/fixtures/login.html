<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bridgey Login</title>
  </head>
  <body>
    <form id="login-form" action="/login" method="post">
      <label>
        Username
        <input id="username" name="username" type="text" />
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" />
      </label>
      <button id="submit" type="submit">Sign In</button>
    </form>
  </body>
</html>
