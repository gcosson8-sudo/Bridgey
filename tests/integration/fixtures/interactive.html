<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bridgey Interactive</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: linear-gradient(180deg, #f8fafc, #dbeafe 55%, #bfdbfe);
      }

      main {
        min-height: 1800px;
        padding: 48px 32px 240px;
      }

      #point-target {
        margin-top: 32px;
        padding: 18px 24px;
        border: none;
        border-radius: 14px;
        background: #2563eb;
        color: #ffffff;
        font-size: 18px;
        cursor: pointer;
      }

      #result,
      #scroll-state,
      #after-scroll {
        margin-top: 24px;
        padding: 16px 18px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.8);
      }

      #after-scroll {
        margin-top: 1100px;
      }
    </style>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const pointTarget = document.getElementById("point-target");
        const result = document.getElementById("result");
        const scrollState = document.getElementById("scroll-state");

        pointTarget?.addEventListener("click", () => {
          result.textContent = "Point click received";
          result.setAttribute("data-state", "clicked");
        });

        const updateScrollState = () => {
          if (window.scrollY > 300) {
            scrollState.textContent = "Scroll reached";
            scrollState.setAttribute("data-state", "scrolled");
          }
        };

        window.addEventListener("scroll", updateScrollState, { passive: true });
        updateScrollState();
      });
    </script>
  </head>
  <body>
    <main>
      <h1>Interactive fixture</h1>
      <p>This page is used to test coordinate clicks, scrolling, and screenshots.</p>
      <button id="point-target" type="button">Click me with coordinates</button>
      <div id="result" data-state="idle">Waiting for point click</div>
      <div id="scroll-state" data-state="top">Waiting for scroll</div>
      <div id="after-scroll">You found the lower page marker.</div>
    </main>
  </body>
</html>
