<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bridgey SPA</title>
    <style>
      #app {
        color: rgb(26, 32, 44);
        font-family: monospace;
      }

      #hydrated {
        display: grid;
        gap: 12px;
        padding: 16px;
        background: rgb(239, 246, 255);
      }

      #continue {
        background: rgb(37, 99, 235);
        color: rgb(255, 255, 255);
      }
    </style>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          const target = document.getElementById("app");
          if (target) {
            target.innerHTML = "<section id='hydrated'><h1>Hydrated content</h1><button id='continue'>Continue</button></section>";
          }
        }, 150);
      });
    </script>
  </head>
  <body>
    <div id="app">Loading...</div>
  </body>
</html>
